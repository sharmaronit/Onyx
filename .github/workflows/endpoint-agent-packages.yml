name: Build Onyx endpoint-agent installers

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to package
        required: true
        default: 1.0.0
  push:
    branches: [main]
    paths: [agent/**, .github/workflows/endpoint-agent-packages.yml]

jobs:
  windows-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WiX and agent dependencies
        shell: powershell
        run: |
          dotnet tool install --global wix --version 5.*
          python -m pip install -r agent/requirements.txt
      - name: Build unsigned development MSI
        shell: powershell
        run: agent/packaging/windows/Build-WindowsInstaller.ps1 -Version '${{ inputs.version || '1.0.0' }}' -AllowUnsignedDevelopmentBuild
      - uses: actions/upload-artifact@v4
        with:
          name: OnyxAgent-windows-x64
          path: agent/dist/OnyxAgent-*-windows-x64.*

  macos-binaries:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build native macOS agent binary
        run: bash agent/packaging/macos/build-binary.sh '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: OnyxAgent-macos-${{ matrix.arch }}
          path: agent/dist/OnyxAgent-${{ matrix.arch }}

  macos-universal-dmg:
    needs: macos-binaries
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: agent/packaging/macos/artifacts
          merge-multiple: true
      - name: Assemble universal macOS installer
        run: bash agent/packaging/macos/build-universal-dmg.sh '${{ inputs.version || '1.0.0' }}'
      - uses: actions/upload-artifact@v4
        with:
          name: OnyxAgent-macos-universal
          path: agent/dist/OnyxAgent-*-macos-universal.*

  development-release:
    needs: [windows-msi, macos-universal-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish development installers to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-v${{ inputs.version || '1.0.0' }}-dev
          name: Onyx Agent ${{ inputs.version || '1.0.0' }} development installers
          prerelease: false
          make_latest: true
          generate_release_notes: false
          files: installers/**
