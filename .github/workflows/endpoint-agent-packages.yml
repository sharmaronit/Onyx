name: Build Onyx endpoint-agent installers

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to package
        required: true
        default: 1.0.2
  push:
    branches: [main]
    paths: [agent/**, .github/workflows/endpoint-agent-packages.yml]

jobs:
  windows-msi:
    runs-on: windows-latest
    env:
      ONYX_WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.ONYX_WINDOWS_CERTIFICATE_PFX_BASE64 }}
      ONYX_WINDOWS_SIGNING_PASSWORD: ${{ secrets.ONYX_WINDOWS_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WiX and agent dependencies
        shell: powershell
        run: |
          dotnet tool install --global wix --version 5.*
          python -m pip install -r agent/requirements.txt
      - name: Build unsigned development MSI
        shell: powershell
        run: |
          if ($env:ONYX_WINDOWS_CERTIFICATE_PFX_BASE64) {
            $certificatePath = Join-Path $env:RUNNER_TEMP 'onyx-signing.pfx'
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:ONYX_WINDOWS_CERTIFICATE_PFX_BASE64))
            $env:ONYX_WINDOWS_SIGNING_PFX = $certificatePath
          }
          agent/packaging/windows/Build-WindowsInstaller.ps1 -Version '${{ inputs.version || '1.0.2' }}' -AllowUnsignedDevelopmentBuild
      - uses: actions/upload-artifact@v4
        with:
          name: OnyxAgent-windows-x64
          path: agent/dist/OnyxAgent-*-windows-x64.*

  macos-binaries:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build native macOS agent binary
        run: bash agent/packaging/macos/build-binary.sh '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: OnyxAgent-macos-${{ matrix.arch }}
          path: agent/dist/OnyxAgent-${{ matrix.arch }}

  macos-universal-dmg:
    needs: macos-binaries
    runs-on: macos-14
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_APPLICATION_IDENTITY: ${{ secrets.APPLE_APPLICATION_IDENTITY }}
      APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: agent/packaging/macos/artifacts
          merge-multiple: true
      - name: Import Apple Developer ID certificates
        if: env.APPLE_CERTIFICATE_P12_BASE64 != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/onyx-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/onyx-signing.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$KEYCHAIN_PATH"
      - name: Assemble universal macOS installer
        run: bash agent/packaging/macos/build-universal-dmg.sh '${{ inputs.version || '1.0.2' }}'
      - uses: actions/upload-artifact@v4
        with:
          name: OnyxAgent-macos-universal
          path: agent/dist/OnyxAgent-*-macos-universal.*

  development-release:
    needs: [windows-msi, macos-universal-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish development installers to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-v${{ inputs.version || '1.0.2' }}-dev
          name: Onyx Agent ${{ inputs.version || '1.0.2' }} development installers
          prerelease: false
          make_latest: true
          generate_release_notes: false
          files: installers/**
