name: release-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Keep the committed lock while allowing npm to select the native optional
      # packages for the current GitHub runner.
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  focused-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: >-
          python -m pip install
          fastapi==0.115.6 uvicorn==0.32.1 httpx==0.28.1
          numpy==1.26.4 networkx==3.2.1 gymnasium==0.29.1
          pyyaml==6.0.1 tqdm==4.66.1 jinja2==3.1.3
      - run: >-
          python -B -m unittest
          tests.test_simulation_correctness
          tests.test_endpoint_response_api
          tests.test_device_enrollment_api
          tests.test_remediation_api
          tests.test_api_simulate_regression
          tests.test_attack_path_regression -v
